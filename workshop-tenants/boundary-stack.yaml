AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Workshop Multi-Tenant: Permission Boundary que limita lo que pueden hacer los
  usuarios estudianteNN dentro de la cuenta del ponente. Solo despliega esto UNA
  VEZ antes del workshop. Despues corre create-students.sh para crear los usuarios.

Parameters:
  BoundaryName:
    Type: String
    Default: WorkshopBoundaryPolicy
    Description: Nombre de la politica de Permission Boundary.

  RolePrefixForPassRole:
    Type: String
    Default: techstore
    Description: >
      Prefijo de nombre que deben tener los roles del workshop para que los
      estudiantes puedan hacer iam:PassRole. Coincide con ProjectName del
      template.yaml principal.

Resources:

  WorkshopBoundaryPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Ref BoundaryName
      Description: "Permission Boundary del taller Bedrock Agents. Allow universal. Solo niega escalacion IAM (crear otros usuarios, attach policies a users) y billing/organization. El ponente asume costos."
      PolicyDocument:
        Version: '2012-10-17'
        Statement:

          # ---------------------------------------------------------------
          # 1. ALLOW universal. El ponente asume el costo de la facturacion;
          #    los participantes pueden usar cualquier servicio que necesite
          #    el taller (Bedrock, Lambda, S3 Vectors, KMS para encryption
          #    de Lambda env vars, CloudFormation, etc.).
          # ---------------------------------------------------------------
          - Sid: AllowAllForWorkshop
            Effect: Allow
            Action: '*'
            Resource: '*'

          # ---------------------------------------------------------------
          # 2. Crear/modificar roles SOLO si incluyen el boundary. Esto sigue
          #    siendo critico: sin esta condicion, un estudiante podria crear
          #    un rol admin sin boundary y asignarlo a una Lambda para escapar.
          # ---------------------------------------------------------------
          - Sid: BloquearCrearRolesSinBoundary
            Effect: Deny
            Action:
              - iam:CreateRole
              - iam:PutRolePolicy
              - iam:AttachRolePolicy
            Resource: '*'
            Condition:
              StringNotEquals:
                iam:PermissionsBoundary: !Sub 'arn:aws:iam::${AWS::AccountId}:policy/${BoundaryName}'

          # ---------------------------------------------------------------
          # 3. Bloqueo de acciones que permitirian escapar del sandbox o
          #    afectar a otros usuarios / la cuenta entera. Lo unico vetado.
          # ---------------------------------------------------------------
          - Sid: BloquearEscalacionYBilling
            Effect: Deny
            Action:
              # IAM escalation paths: NO pueden crear / modificar otros usuarios.
              - iam:CreateUser
              - iam:DeleteUser
              - iam:UpdateUser
              - iam:CreateGroup
              - iam:DeleteGroup
              - iam:UpdateGroup
              - iam:CreatePolicy
              - iam:CreatePolicyVersion
              - iam:DeletePolicy
              - iam:DeletePolicyVersion
              - iam:SetDefaultPolicyVersion
              - iam:AttachUserPolicy
              - iam:DetachUserPolicy
              - iam:PutUserPolicy
              - iam:DeleteUserPolicy
              - iam:PutGroupPolicy
              - iam:AttachGroupPolicy
              - iam:DetachGroupPolicy
              - iam:DeleteGroupPolicy
              - iam:AddUserToGroup
              - iam:RemoveUserFromGroup
              - iam:CreateAccessKey
              - iam:DeleteAccessKey
              - iam:UpdateAccessKey
              - iam:CreateLoginProfile
              - iam:DeleteLoginProfile
              - iam:UpdateLoginProfile
              - iam:PutUserPermissionsBoundary
              - iam:DeleteUserPermissionsBoundary
              - iam:PutRolePermissionsBoundary
              - iam:DeleteRolePermissionsBoundary
              # Federacion / STS dangerous
              - sts:AssumeRoleWithWebIdentity
              - sts:AssumeRoleWithSAML
              # Cuenta / Organization / Billing — solo el ponente toca esto.
              - organizations:*
              - account:*
              - aws-portal:*
              - billing:*
              - budgets:*
              - savingsplans:*
              - ce:*
              - cur:*
            Resource: '*'

Outputs:

  PolicyArn:
    Value: !Ref WorkshopBoundaryPolicy
    Description: ARN del Permission Boundary. Usalo en create-students.sh y en deploy.sh (variable WORKSHOP_BOUNDARY_ARN).
    Export:
      Name: WorkshopBoundaryPolicyArn

  PolicyName:
    Value: !Ref BoundaryName
    Description: Nombre de la politica de boundary.

  HowToUse:
    Value: !Sub >
      Exporta antes de correr deploy.sh / create-students.sh:
      export WORKSHOP_BOUNDARY_ARN=arn:aws:iam::${AWS::AccountId}:policy/${BoundaryName}
    Description: Como inyectar el boundary en los siguientes pasos.
